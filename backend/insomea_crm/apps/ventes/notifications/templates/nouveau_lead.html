<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4CAF50; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .info-block { background: #fff; border-left: 4px solid #4CAF50; padding: 12px 16px; margin: 16px 0; }
        .button { display: inline-block; padding: 10px 20px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Nouvelle demande client</h1>
        </div>

        <div class="content">
            <p>Bonjour {{ recipient.get_full_name }},</p>

            <p>Une nouvelle demande a été soumise via le formulaire public.</p>

            <div class="info-block">
                <p><strong>Entreprise :</strong> {{ notification.title|slice:"18:" }}</p>
                <p><strong>Message :</strong> {{ notification.message }}</p>
            </div>

            <p>Connectez-vous au CRM pour prendre en charge cette demande.</p>

            <p style="text-align: center; margin-top: 30px;">
                <a href="{{ site_url }}{{ notification.action_url }}" class="button">Voir la demande</a>
            </p>
        </div>
    </div>
</body>
</html>
