<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial; font-size: 12px; }
        .header { font-size: 18px; font-weight: bold; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { border: 1px solid #ddd; padding: 8px; }
    </style>
</head>
<body>

<div class="header">Devis {{ quote.reference }}</div>

<p>Client: {{ quote.opportunity.client.name }}</p>

<table class="table">
    <thead>
        <tr>
            <th>Produit</th>
            <th>Achat</th>
            <th>Vente</th>
            <th>Marge</th>
        </tr>
    </thead>
    <tbody>
        {% for line in lines %}
        <tr>
            <td>{{ line.opportunity_line.name }}</td>
            <td>{{ line.unit_price_purchase }}</td>
            <td>{{ line.unit_price_sale }}</td>
            <td>{{ line.margin }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<p>Total: {{ quote.total_sale }}</p>

</body>
</html>
