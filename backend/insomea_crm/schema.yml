        ViewSet pour InsomeaQuote (devis Insomea)

        READ-ONLY (création via OpportunityViewSet.create_insomea_quote)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - ventes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInsomeaQuoteList'
          description: ''
  /api/ventes/insomea-quotes/{id}/:
    get:
      operationId: ventes_insomea_quotes_retrieve
      description: |-
        ViewSet pour InsomeaQuote (devis Insomea)

        READ-ONLY (création via OpportunityViewSet.create_insomea_quote)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ventes
      security:
      - jwtAuth: []
      responses:
        '200':
