  /api/ventes/opportunities/:
    get:
      operationId: ventes_opportunities_list
      description: Liste opportunités
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - ventes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOpportunityListList'
          description: ''
    post:
      operationId: ventes_opportunities_create
      description: "Créer opportunité\n\nBody:\n    {\n        \"name\": \"Nom\",\n
        \       \"client\": \"uuid\",\n        \"type\": \"INITIAL\",  // \U0001F195
        INITIAL, RENEWAL, UPSELL, DOWNGRADE\n        \"related_opportunity\": \"uuid\",
        \ // \U0001F195 Si RENEWAL\n        \"assigned_to\": \"uuid\",\n        \"notes\":
        \"\"\n    }"
      tags:
      - ventes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpportunityCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpportunityCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityCreate'
          description: ''
  /api/ventes/opportunities/{id}/:
    get:
      operationId: ventes_opportunities_retrieve
      description: Détail opportunité
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ventes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetail'
          description: ''
    put:
      operationId: ventes_opportunities_update
      description: "ViewSet Opportunités\n\nEndpoints:\n    GET    /opportunities/
        \             - Liste\n    POST   /opportunities/              - Créer\n    GET
        \   /opportunities/:id/          - Détail\n    PATCH  /opportunities/:id/
        \         - Update\n    DELETE /opportunities/:id/          - Delete\n\n    \U0001F195
        GET    /opportunities/renewals/     - Liste RENEWAL\n    \U0001F195 GET    /opportunities/initials/
        \    - Liste INITIAL\n    \U0001F195 GET    /opportunities/upsells/      -
        Liste UPSELL\n\n    POST   /opportunities/:id/request_supplier_quotes/\n    POST
        \  /opportunities/:id/request_client_po/\n    POST   /opportunities/:id/approve/\n
        \   POST   /opportunities/:id/cancel/"
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ventes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpportunityUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpportunityUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityUpdate'
          description: ''
    patch:
      operationId: ventes_opportunities_partial_update
      description: Update opportunité
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ventes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOpportunityUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOpportunityUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOpportunityUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityUpdate'
          description: ''
    delete:
      operationId: ventes_opportunities_destroy
      description: Delete opportunité
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ventes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ventes/opportunities/{id}/approve/:
    post:
