          type: string
          writeOnly: true
        new_password_confirm:
          type: string
          writeOnly: true
      required:
      - new_password
      - new_password_confirm
      - old_password
    CompleteProvisioning:
      type: object
      description: "Serializer complete provisioning\n\n\U0001F195 MODIFIÉ: Support
        INITIAL vs RENEWAL\n\nUsage:\n    POST /provisions/:id/complete/\n\nInput:\n
        \   CAS INITIAL:\n    {\n        \"subscription_number\": \"MS-123\",\n        \"start_date\":
        \"2024-01-01\",\n        \"end_date\": \"2025-01-01\"\n    }\n\n    CAS RENEWAL:\n
        \   {\n        \"start_date\": \"2025-01-01\",\n        \"end_date\": \"2026-01-01\"\n
        \       # PAS de subscription_number\n    }"
      properties:
        subscription_number:
          type: string
          description: Microsoft Subscription ID (requis si INITIAL)
          maxLength: 200
        start_date:
          type: string
          format: date
          description: Date début terme
        end_date:
          type: string
          format: date
          description: Date fin terme
      required:
      - end_date
      - start_date
    CreateInsomeaQuote:
      type: object
      description: |-
        Serializer pour création devis Insomea

        Usage:
            POST /opportunities/{id}/create-insomea-quote/

        Input:
            {
                "discount_percent": 10.00,
                "notes": "...",
                "lines_pricing": [
                    {
                        "line_id": "uuid",
                        "unit_price_sale": 120.00
                    },
                    ...
                ]
            }
      properties:
        discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          default: '0.00'
        notes:
          type: string
          maxLength: 2000
        lines_pricing:
          type: array
          items:
            type: object
            additionalProperties: {}
          minItems: 1
      required:
      - lines_pricing
    CreateRenewal:
      type: object
      description: |-
        Serializer création opportunité renewal

        Usage:
            - POST /subscriptions/:id/create_renewal/

        Input:
            (vide - tout auto depuis subscription)

        Output:
            - opportunity: Opportunity créée
            - line: OpportunityLine créée
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Nouvelle quantité (optionnel, sinon garde existante)
        notes:
          type: string
          description: Notes opportunité renewal
    CreateSupplierQuote:
      type: object
      description: |-
        Serializer pour création devis fournisseur

        Usage:
            POST /supplier-quotes/

        Input:
            {
                "supplier_id": "uuid",
                "reference": "REF-123",
                "document": <file>,
                "discount_percent": 5.00,
                "lines": [
                    {
                        "line_id": "uuid",
                        "unit_price_purchase": 100.00,
                        "sku": "CFQ...",
                        "currency": "EUR",
                        "delivery_time": 7
                    },
                    ...
                ]
            }
      properties:
        supplier_id:
          type: string
          format: uuid
          writeOnly: true
        reference:
          type: string
          maxLength: 100
        document:
          type: string
          format: uri
          writeOnly: true
        discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          default: '0.00'
        lines:
          type: array
          items:
            type: object
            additionalProperties: {}
          minItems: 1
      required:
      - document
      - lines
      - supplier_id
