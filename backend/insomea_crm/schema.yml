              $ref: '#/components/schemas/AdminCreateUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCreateUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCreateUser'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreateUser'
          description: ''
  /api/auth/change-password/:
